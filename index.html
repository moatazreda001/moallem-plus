<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3558c9">
<title>مدرس بلس</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1e2433;--mut:#6a7388;--pri:#3558c9;--priTx:#fff;--red:#c0392b;--grn:#1f8a58;--bd:#e1e4ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1b1f2b;--tx:#e8ebf5;--mut:#9aa3ba;--pri:#6b8cff;--priTx:#0c1233;--red:#ec7063;--grn:#5fd09a;--bd:#2a3040}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1b1f2b;--tx:#e8ebf5;--mut:#9aa3ba;--pri:#6b8cff;--priTx:#0c1233;--red:#ec7063;--grn:#5fd09a;--bd:#2a3040}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 100px}
h1{font-size:20px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}
.user-badges{display:flex;gap:6px;align-items:center}
.install-badge{font-size:12px;background:var(--pri);color:var(--priTx);padding:4px 10px;border-radius:20px;cursor:pointer;font-weight:600;display:inline-block}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tabs button.on{background:var(--pri);color:var(--priTx);border-color:var(--pri)}
button{font:inherit;border:0;border-radius:12px;padding:11px 14px;background:var(--pri);color:var(--priTx);cursor:pointer}
button.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.red{background:transparent;color:var(--red);border:1.5px solid var(--red)}
button.sm{padding:7px 11px;font-size:13px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:10px}
.chk{display:flex;align-items:center;gap:8px;margin-bottom:10px}.chk input{width:auto;margin:0}
.stats{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.stat{flex:1;min-width:45%;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.stat small{color:var(--mut)}.stat b{display:block;font-size:18px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.item .n{font-weight:600}.item .p{color:var(--mut);font-size:13px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge{border-radius:20px;padding:8px 14px;font-size:14px;white-space:nowrap}
.paid{background:var(--grn);color:#fff}.unpaid{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.pres{background:var(--grn);color:#fff}.abs{background:transparent;color:var(--mut);border:1.5px solid var(--bd)}
.free{color:var(--mut);border:1.5px dashed var(--bd);border-radius:20px;padding:8px 14px;font-size:14px}
.tag{color:var(--pri);font-size:12px}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:14px 20px;border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:10}
.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.month button{padding:8px 14px}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);width:min(92vw,420px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.row{display:flex;gap:8px}.row>*{flex:1}
.link{color:var(--pri);font-size:13px;text-decoration:none}
.hint{color:var(--mut);font-size:13px;margin:-4px 0 10px}
.student-table{width:100%;border-collapse:separate;border-spacing:0 7px;table-layout:fixed}.student-table th{font-size:13px;color:var(--mut);font-weight:600;padding:4px}.student-table td{padding:0 3px}.student-table input{margin:0;padding:10px 8px;min-width:0}.student-table .delrow{padding:9px 10px;background:transparent;color:var(--red);border:1px solid var(--bd)}.addrow{width:100%;margin:7px 0 12px}.dlg-actions{display:flex;gap:8px}.dlg-actions>*{flex:1}
.grp-card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;overflow:hidden}
.grp-hdr{padding:13px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;gap:10px}
.grp-hdr:active{opacity:.85}
.grp-title{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.grp-arrow{display:inline-block;font-size:12px;color:var(--mut);transition:transform .2s ease}
.grp-card.open .grp-arrow{transform:rotate(-90deg)}
.grp-meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.grp-pill{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:3px 9px;font-weight:600;color:var(--tx)}
.grp-body{border-top:1px solid var(--bd);padding:10px;background:var(--bg)}
.grp-search{margin-bottom:8px;padding:9px 12px;font-size:14px;border-radius:10px}
.sync-bar{font-size:11px;color:var(--grn);text-align:center;margin-bottom:8px}
.pass-wrapper{position:relative;display:flex;align-items:center}
.pass-wrapper input{margin-bottom:0}
.days-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.day-chk{display:flex;align-items:center;gap:4px;font-size:13px;background:var(--bg);border:1px solid var(--bd);padding:6px 8px;border-radius:8px;cursor:pointer}
.day-chk input{width:auto;margin:0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<dialog id="dlg"><h3 id="dt" style="margin-top:0"></h3><div id="df"></div></dialog>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').catch(function(err) {});
  });
}

var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
});

var db = { s: [], g: [], pay: {}, att: {} };
var saved = localStorage.getItem("tutorAppData_standalone");
if (saved) { try { db = JSON.parse(saved); } catch(e) {} }
db.g = (db.g || []).map(function(g) { return typeof g === "string" ? { id: g, n: g, fee: 0, days: [0,1,2,3,4,5,6] } : g; });

var tab = "pay", gsel = "", mon = new Date(), dayD = new Date(), attQuery = "", openGrps = {}, grpQueries = "", studentQuery = "", studentFilterGrp = "all", studentFilterMonth = "all", syncStatus = "محلي وآمن تماماً", showAllGroupsToday = false;

function save() {
  try {
    localStorage.setItem("tutorAppData_standalone", JSON.stringify(db));
    syncStatus = "✓ تم الحفظ محلياً";
  } catch(e) { syncStatus = "خطأ في الحفظ"; }
  render();
}

function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, function(m) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]; }); }
function mk(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function dk(d) { return mk(d) + "-" + String(d.getDate()).padStart(2, "0"); }
function mlabel(d) { return d.toLocaleDateString("ar-EG", { month: "long", year: "numeric" }); }
function dlabel(d) { return d.toLocaleDateString("ar-EG", { weekday: "long", day: "numeric", month: "long" }); }
function money(n) { return Number(n).toLocaleString("ar-EG") + " ج"; }
function grp(id) { return db.g.find(function(g) { return g.id === id; }); }
function fee(s) { if (s.free) return 0; var baseFee = (s.cf != null && s.cf !== "") ? (+s.cf || 0) : (grp(s.g) ? +grp(s.g).fee || 0 : 0); var extra = +s.ex || 0; return baseFee + extra; }

function render() {
  if (db.g.length && !grp(gsel)) gsel = db.g[0].id;
  var h = '<h1>🎓 مدرس بلس <div class="user-badges"><button id="installAppBtn" class="install-badge">📥 تثبيت التطبيق</button></div></h1>';
  h += '<div class="sync-bar">' + syncStatus + '</div>';
  h += '<div class="tabs"><button data-t="pay" class="' + (tab === "pay" ? "on" : "") + '">المصاريف</button><button data-t="att" class="' + (tab === "att" ? "on" : "") + '">الحضور</button><button data-t="students" class="' + (tab === "students" ? "on" : "") + '">الطلاب</button><button data-t="grp" class="' + (tab === "grp" ? "on" : "") + '">المجموعات</button></div>';
  
  if (tab === "pay") h += payView();
  else if (tab === "att") h += attView();
  else if (tab === "students") h += studentsView();
  else h += grpView();

  document.getElementById("app").innerHTML = h;
  
  var instBtn = document.getElementById("installAppBtn");
  if (instBtn) {
    instBtn.onclick = function() {
      if (deferredPrompt) {
        // إطلاق نافذة التثبيت المباشر من المتصفح بنقرة واحدة
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(choiceResult) {
          if (choiceResult.outcome === 'accepted') {
            console.log('تم تثبيت التطبيق بنجاح');
          }
          deferredPrompt = null;
        });
      } else {
        // لو متصفح الموبايل حجب نافذة التثبيت التلقائية، نعرض إرشاداً سريعاً أو نفتح القائمة
        alert("لتثبيت التطبيق على شاشة هاتفك فوراً:\n1. اضغط على قائمة الثلاث نقاط أعلى متصفح كروم.\n2. اختر 'تثبيت التطبيق' (Install app) أو 'إضافة إلى الشاشة الرئيسية'.");
      }
    };
  }

  document.querySelectorAll(".tabs button").forEach(function(b) {
    b.onclick = function() { tab = b.dataset.t; if (tab !== "att") { attQuery = ""; } render(); };
  });
  bind();
}

function groupSel() { return '<select id="gs">' + db.g.map(function(g) { return '<option value="' + esc(g.id) + '"' + (g.id === gsel ? ' selected' : '') + '>' + esc(g.n) + '</option>'; }).join("") + '</select>'; }

function payView() {
  var m = mk(mon), paid = db.pay[m] || {};
  var pay = db.s.filter(function(s) { return !s.free; });
  var np = pay.filter(function(s) { return paid[s.id]; }).length;
  
  var totalCollected = pay.filter(function(s) { return paid[s.id]; }).reduce(function(a, s) { return a + fee(s); }, 0);
  var left = pay.filter(function(s) { return !paid[s.id]; }).reduce(function(a, s) { return a + fee(s); }, 0);

  var h = '<div class="month"><button class="sec" id="pm">→</button><b>' + mlabel(mon) + '</b><button class="sec" id="nm">←</button></div>';
  h += '<div style="margin-bottom:8px"><button class="sec sm" id="monthReportBtn" style="width:100%">📊 تقرير الشهر المالي الشامل</button></div>';
  h += '<div class="stats">' +
       '<div class="stat"><small>دفعوا</small><b>' + np + ' / ' + pay.length + '</b></div>' +
       '<div class="stat"><small>إجمالي المحصل</small><b style="color:var(--grn)">' + money(totalCollected) + '</b></div>' +
       '<div class="stat" style="flex-basis:100%"><small>المتبقي تحصيله</small><b style="color:var(--red)">' + money(left) + '</b></div>' +
       '</div>';

  if (!db.g.length) return h + '<div class="empty">ابدأ بإضافة مجموعة من تبويب المجموعات</div>';
  h += groupSel();
  var shown = db.s.filter(function(s) { return s.g === gsel; });
  shown.forEach(function(s) {
    var p = !!paid[s.id], hasExtra = s.ex && +s.ex > 0, cust = !s.free && s.cf != null && s.cf !== "";
    h += '<div class="item"><div><div class="n" data-es="' + s.id + '" style="cursor:pointer">' + esc(s.n) + ' ✎</div><div class="p">' + (s.free ? 'معفي' : money(fee(s))) + (cust ? ' <span class="tag">· خاصة</span>' : '') + (hasExtra ? ' <span class="tag">· إضافي: ' + money(s.ex) + '</span>' : '') + (s.ph && !s.free && !p ? ' · <a class="link" target="_blank" rel="noopener" href="' + waPay(s) + '">تذكير واتساب</a>' : '') + '</div></div>' + (s.free ? '<span class="free">معفي</span>' : '<button class="badge ' + (p ? 'paid' : 'unpaid') + '" data-pid="' + s.id + '">' + (p ? '✓ دفع' : 'لسه') + '</button>') + '</div>';
  });
  if (!shown.length) h += '<div class="empty">مفيش طلاب في المجموعة دي</div>';
  return h + fab();
}

function waPay(s) { var ph = String(s.ph).replace(/\D/g, ""); if (ph.indexOf("0") === 0) ph = "2" + ph; return "https://wa.me/" + ph + "?text=" + encodeURIComponent("السلام عليكم، تذكير بمصاريف شهر " + mlabel(mon) + " للطالب " + s.n + " (" + money(fee(s)) + "). شكراً."); }
function waAbs(s, absDates) { var ph = String(s.ph).replace(/\D/g, ""); if (ph.indexOf("0") === 0) ph = "2" + ph; return "https://wa.me/" + ph + "?text=" + encodeURIComponent("السلام عليكم ولي أمر الطالب " + s.n + "، نود إحاطتكم بأن الطالب تغيب عن الحضور في الأيام التالية:\n" + absDates.join(", ") + "\nبرجاء المتابعة وشكراً."); }

function attView() {
  var d = dk(dayD), rec = db.att[d] || {};
  var currentDayOfWeek = dayD.getDay(); 
  var h = '<div class="month"><button class="sec" id="pd">→</button><b>' + dlabel(dayD) + '</b><button class="sec" id="nd">←</button></div>';
  if (!db.g.length) return h + '<div class="empty">ضيف مجموعة الأول</div>';
  
  var totPres = db.s.filter(function(s) { return !!rec[s.id]; }).length;
  h += '<div class="stats"><div class="stat"><small>إجمالي الحضور اليوم</small><b>' + totPres + ' / ' + db.s.length + '</b></div></div>';
  h += '<input id="attSearch" type="search" placeholder="ابحث باسم الطالب في كل المجموعات..." value="' + esc(attQuery) + '" style="margin-bottom:10px">';
  
  var globalQ = attQuery.trim().toLowerCase();
  if (globalQ) {
    var matched = db.s.filter(function(s) { return s.n.toLowerCase().indexOf(globalQ) !== -1; });
    matched.forEach(function(s) {
      var p = !!rec[s.id], g = grp(s.g);
      h += '<div class="item"><div><div class="n">' + esc(s.n) + '</div><div class="p">' + esc(g ? g.n : 'مجموعة محذوفة') + '</div></div><button class="badge ' + (p ? 'pres' : 'abs') + '" data-aid="' + s.id + '">' + (p ? '✓ حضر' : 'غايب') + '</button></div>';
    });
    if (!matched.length) h += '<div class="empty">ملقيناش طالب بالاسم ده</div>';
    return h + fab();
  }

  var targetGroups = db.g.filter(function(g) {
    if (showAllGroupsToday) return true;
    if (!g.days || !g.days.length) return true;
    return g.days.includes(currentDayOfWeek);
  });

  h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:13px;color:var(--mut)">مجموعات اليوم (' + targetGroups.length + ')</span><button class="sec sm" id="toggleAllGroups">' + (showAllGroupsToday ? 'عرض مجموعات اليوم فقط' : 'عرض كل المجموعات') + '</button></div>';

  if (!targetGroups.length) {
    h += '<div class="empty">مفيش مجموعات جدولها اليوم. يمكنك الضغط على "عرض كل المجموعات".</div>';
    return h + fab();
  }

  targetGroups.forEach(function(g) {
    var gStudents = db.s.filter(function(s) { return s.g === g.id; });
    var gPres = gStudents.filter(function(s) { return !!rec[s.id]; }).length;
    var isOpen = !!openGrps[g.id];
    var gQ = (grpQueries[g.id] || "").trim().toLowerCase();
    var filtered = gQ ? gStudents.filter(function(s) { return s.n.toLowerCase().indexOf(gQ) !== -1; }) : gStudents;
    h += '<div class="grp-card' + (isOpen ? ' open' : '') + '">';
    h += '<div class="grp-hdr" data-tg="' + esc(g.id) + '">';
    h += '<div class="grp-title"><span class="grp-arrow">◀</span><span>' + esc(g.n) + '</span></div>';
    h += '<div class="grp-meta"><span class="grp-pill">' + gPres + ' / ' + gStudents.length + '</span></div>';
    h += '</div>';
    if (isOpen) {
      h += '<div class="grp-body">';
      if (gStudents.length) {
        h += '<input class="grp-search" data-gsq="' + esc(g.id) + '" type="search" placeholder="ابحث جوه ' + esc(g.n) + '..." value="' + esc(grpQueries[g.id] || "") + '">';
        if (filtered.length) {
          filtered.forEach(function(s) {
            var p = !!rec[s.id];
            h += '<div class="item"><div><div class="n">' + esc(s.n) + '</div></div><button class="badge ' + (p ? 'pres' : 'abs') + '" data-aid="' + s.id + '">' + (p ? '✓ حضر' : 'غايب') + '</button></div>';
          });
        } else {
          h += '<div class="empty" style="padding:14px 0">مفيش طالب بالاسم ده في المجموعة</div>';
        }
      } else {
        h += '<div class="empty" style="padding:14px 0">مفيش طلاب في المجموعة دي</div>';
      }
      h += '</div>';
    }
    h += '</div>';
  });
  return h + fab();
}

function studentsView() {
  var h = '<div class="month"><button class="sec" id="spm">→</button><b>' + (studentFilterMonth === 'all' ? 'كل الشهور' : mlabel(mon)) + '</b><button class="sec" id="snm">←</button></div>';
  h += '<div class="row" style="margin-bottom:10px"><input id="studentSearchInput" type="search" placeholder="بحث بالاسم..." value="' + esc(studentQuery) + '" style="margin-bottom:0">';
  h += '<select id="studentGroupFilter" style="margin-bottom:0"><option value="all">كل المجموعات</option>' + db.g.map(function(g) { return '<option value="' + g.id + '"' + (studentFilterGrp === g.id ? ' selected' : '') + '>' + esc(g.n) + '</option>'; }).join('') + '</select></div>';
  
  var sq = studentQuery.trim().toLowerCase();
  var filtered = db.s.filter(function(s) {
    if (studentFilterGrp !== 'all' && s.g !== studentFilterGrp) return false;
    if (sq && s.n.toLowerCase().indexOf(sq) === -1) return false;
    return true;
  });

  if (!filtered.length) return h + '<div class="empty">مفيش طلاب مطابقة للبحث</div>';

  filtered.forEach(function(s) {
    var g = grp(s.g);
    var presCount = 0, absDates = [];
    Object.keys(db.att).sort().forEach(function(dt) {
      var dayRec = db.att[dt] || {};
      var daySt = db.s.find(function(x) { return x.g === s.g; });
      if (daySt) {
        if (studentFilterMonth === 'all' || dt.indexOf(mk(mon)) === 0) {
          if (dayRec[s.id]) { presCount++; } else { absDates.push(dt); }
        }
      }
    });

    var mKey = mk(mon);
    var isPaid = db.pay[mKey] && db.pay[mKey][s.id];

    h += '<div class="item" style="flex-direction:column;align-items:stretch;gap:8px">';
    h += '<div style="display:flex;justify-content:space-between;align-items:center"><div><div class="n" data-es="' + s.id + '" style="cursor:pointer">' + esc(s.n) + ' ✎</div><div class="p">' + esc(g ? g.n : '') + ' · ' + (s.free ? 'معفي' : money(fee(s))) + '</div></div>';
    h += s.free ? '<span class="free">معفي</span>' : '<button class="badge ' + (isPaid ? 'paid' : 'unpaid') + '" data-pid="' + s.id + '">' + (isPaid ? '✓ دفع' : 'لسه') + '</button>';
    h += '</div><div style="font-size:12px;background:var(--bg);padding:8px;border-radius:10px;border:1px solid var(--bd);display:flex;flex-direction:column;gap:6px">';
    h += '<div style="display:flex;justify-content:space-between;align-items:center"><span>حضر: <b style="color:var(--grn)">' + presCount + '</b> يوم | غاب: <b style="color:var(--red)">' + absDates.length + '</b> يوم</span>' + (s.ph && absDates.length ? '<a class="link" target="_blank" rel="noopener" href="' + waAbs(s, absDates) + '">💬 إرسال الغياب لواتساب</a>' : '') + '</div>';
    h += '<div style="color:var(--red)">تواريخ الغياب: ' + (absDates.length ? absDates.join(', ') : 'لا يوجد غياب') + '</div>';
    h += '</div></div>';
  });

  return h + fab();
}

function grpView() {
  var h = '';
  if (!db.g.length) h += '<div class="empty">لسه مفيش مجموعات. مثال: تانية ثانوي - رياضيات</div>';
  db.g.forEach(function(g) {
    var n = db.s.filter(function(s) { return s.g === g.id; }).length;
    var dayNames = ["أحد", "إثنين", "ثلاثاء", "أربعاء", "خميس", "جمعة", "سبت"];
    var gDaysStr = (g.days && g.days.length < 7) ? g.days.map(function(d){return dayNames[d];}).join(", ") : "كل الأيام";
    h += '<div class="item"><div><div class="n">' + esc(g.n) + '</div><div class="p">' + n + ' طالب · ' + money(g.fee || 0) + ' شهرياً<br><small style="color:var(--pri)">الأيام: ' + gDaysStr + '</small></div></div><div class="acts"><button class="sm" data-ag="' + esc(g.id) + '">+ طلاب</button><button class="sm sec" data-eg="' + esc(g.id) + '">تعديل</button><button class="sm red" data-dg="' + esc(g.id) + '">حذف</button></div></div>';
  });
  return h + '<button class="fab" id="addg">+ مجموعة جديدة</button>';
}

function fab() { return '<button class="fab" id="adds">+ طلاب</button>'; }

function openMonthReport() {
  var m = mk(mon), paid = db.pay[m] || {};
  var pay = db.s.filter(function(s) { return !s.free; });
  var freeCount = db.s.length - pay.length;
  var paidStudents = pay.filter(function(s) { return paid[s.id]; });
  var unpaidStudents = pay.filter(function(s) { return !paid[s.id]; });
  
  var expectedTotal = pay.reduce(function(a, s) { return a + fee(s); }, 0);
  var collectedTotal = paidStudents.reduce(function(a, s) { return a + fee(s); }, 0);
  var remainingTotal = unpaidStudents.reduce(function(a, s) { return a + fee(s); }, 0);

  var f = document.getElementById('df'), d = document.getElementById('dlg');
  var html = '<div style="font-size:14px;line-height:1.6">' +
             '<p><b>الشهر:</b> ' + mlabel(mon) + '</p>' +
             '<p><b>إجمالي الطلاب:</b> ' + db.s.length + ' (' + pay.length + ' دافع، ' + freeCount + ' معفي)</p>' +
             '<p><b>إجمالي الدخل المتوقع:</b> ' + money(expectedTotal) + '</p>' +
             '<p style="color:var(--grn)"><b>إجمالي المحصل فعلياً:</b> ' + money(collectedTotal) + '</p>' +
             '<p style="color:var(--red)"><b>المتبقي تحصيله:</b> ' + money(remainingTotal) + '</p>' +
             '<hr style="border:0;border-top:1px solid var(--bd);margin:12px 0">' +
             '<p><b>الطلاب الذين لم يدفعوا (' + unpaidStudents.length + '):</b></p>' +
             '<div style="max-height:120px;overflow-y:auto;background:var(--bg);padding:8px;border-radius:8px;font-size:13px">' +
             (unpaidStudents.length ? unpaidStudents.map(function(s){ return esc(s.n) + ' (' + money(fee(s)) + ')'; }).join(', ') : 'الكل دفع!') +
             '</div></div>' +
             '<div class="dlg-actions" style="margin-top:14px"><button id="printRep">🖨️ طباعة التقرير</button><button class="sec" id="closeRep">إغلاق</button></div>';

  f.innerHTML = html; document.getElementById('dt').textContent = 'تقرير الشهر المالي'; d.showModal();
  document.getElementById('closeRep').onclick = function() { d.close(); };
  document.getElementById('printRep').onclick = function() { window.print(); };
}

function bind() {
  var q = function(i) { return document.getElementById(i); };
  if (q("gs")) q("gs").onchange = function() { gsel = this.value; render(); };
  if (q("attSearch")) q("attSearch").oninput = function() { var pos = this.selectionStart; attQuery = this.value; render(); var el = q("attSearch"); if (el) { el.focus(); el.setSelectionRange(pos, pos); } };
  if (q("toggleAllGroups")) q("toggleAllGroups").onclick = function() { showAllGroupsToday = !showAllGroupsToday; render(); };
  if (q("monthReportBtn")) q("monthReportBtn").onclick = openMonthReport;
  
  if (q("studentSearchInput")) q("studentSearchInput").oninput = function() { var pos = this.selectionStart; studentQuery = this.value; render(); var el = q("studentSearchInput"); if (el) { el.focus(); el.setSelectionRange(pos, pos); } };
  if (q("studentGroupFilter")) q("studentGroupFilter").onchange = function() { studentFilterGrp = this.value; render(); };
  if (q("spm")) q("spm").onclick = function() { studentFilterMonth = studentFilterMonth === 'all' ? mk(mon) : 'all'; render(); };
  if (q("snm")) q("snm").onclick = function() { studentFilterMonth = studentFilterMonth === 'all' ? mk(mon) : 'all'; render(); };

  document.querySelectorAll("[data-tg]").forEach(function(h) {
    h.onclick = function() { var gid = h.dataset.tg; openGrps[gid] = !openGrps[gid]; if (openGrps[gid]) gsel = gid; render(); };
  });
  document.querySelectorAll("[data-gsq]").forEach(function(inp) {
    inp.oninput = function() { var gid = inp.dataset.gsq, pos = inp.selectionStart; grpQueries[gid] = inp.value; render(); var el = document.querySelector('[data-gsq="' + CSS.escape(gid) + '"]'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } };
  });

  if (q("pm")) q("pm").onclick = function() { mon = new Date(mon.getFullYear(), mon.getMonth() - 1, 1); render(); };
  if (q("nm")) q("nm").onclick = function() { mon = new Date(mon.getFullYear(), mon.getMonth() + 1, 1); render(); };
  if (q("pd")) q("pd").onclick = function() { dayD = new Date(dayD.getTime() - 864e5); render(); };
  if (q("nd")) q("nd").onclick = function() { dayD = new Date(dayD.getTime() + 864e5); render(); };
  
  document.querySelectorAll("[data-pid]").forEach(function(b) { b.onclick = function() { var m = mk(mon); db.pay[m] = db.pay[m] || {}; db.pay[m][b.dataset.pid] = !db.pay[m][b.dataset.pid]; save(); render(); }; });
  document.querySelectorAll("[data-aid]").forEach(function(b) { b.onclick = function() { var d = dk(dayD); db.att[d] = db.att[d] || {}; db.att[d][b.dataset.aid] = !db.att[d][b.dataset.aid]; save(); render(); }; });
  document.querySelectorAll("[data-es]").forEach(function(e) { e.onclick = function() { editStudent(e.dataset.es); }; });
  document.querySelectorAll("[data-ag]").forEach(function(b) { b.onclick = function() { newStudents(b.dataset.ag); }; });
  document.querySelectorAll("[data-eg]").forEach(function(b) { b.onclick = function() { editGroup(b.dataset.eg); }; });
  document.querySelectorAll("[data-dg]").forEach(function(b) { b.onclick = function() { var g = grp(b.dataset.dg); if (confirm("حذف المجموعة " + g.n + " وكل طلابها؟")) { db.s = db.s.filter(function(s) { return s.g !== g.id; }); db.g = db.g.filter(function(x) { return x.id !== g.id; }); delete openGrps[g.id]; save(); render(); } }; });
  if (q("addg")) q("addg").onclick = newGroup;
  if (q("adds")) q("adds").onclick = function() { if (!db.g.length) { tab = "grp"; render(); return; } newStudents(gsel); };
}

function studentRowsHTML(count) {
  var h = '<table class="student-table"><thead><tr><th style="width:40%">اسم الطالب</th><th style="width:35%">موبايل ولي الأمر</th><th>إضافي</th><th style="width:35px"></th></tr></thead><tbody id="studentRows">';
  for (var i = 0; i < (count || 3); i++) h += '<tr><td><input class="student-name" type="text" placeholder="الاسم" autocomplete="off"></td><td><input class="student-phone" type="tel" inputmode="tel" placeholder="الموبايل" autocomplete="off"></td><td><input class="student-extra" type="number" inputmode="decimal" placeholder="ملزمة" autocomplete="off"></td><td><button type="button" class="delrow" title="حذف">×</button></td></tr>';
  return h + '</tbody></table><button type="button" class="sec addrow" id="addStudentRow">+ إضافة طالب آخر</button>';
}

function setupStudentRows() {
  var body = document.getElementById('studentRows'); if (!body) return;
  function addRow(focus) { var tr = document.createElement('tr'); tr.innerHTML = '<td><input class="student-name" type="text" placeholder="الاسم" autocomplete="off"></td><td><input class="student-phone" type="tel" inputmode="tel" placeholder="الموبايل" autocomplete="off"></td><td><input class="student-extra" type="number" inputmode="decimal" placeholder="ملزمة" autocomplete="off"></td><td><button type="button" class="delrow" title="حذف">×</button></td>'; body.appendChild(tr); if (focus) tr.querySelector('.student-name').focus(); }
  document.getElementById('addStudentRow').onclick = function() { addRow(true); };
  body.addEventListener('input', function(e) { var tr = e.target.closest('tr'); if (tr && tr === body.lastElementChild && e.target.value.trim()) addRow(false); });
  body.addEventListener('click', function(e) { if (e.target.classList.contains('delrow')) { if (body.children.length > 1) e.target.closest('tr').remove(); else { body.querySelectorAll('input').forEach(function(x) { x.value = ''; }); } } });
}

function collectStudentRows() { 
  return Array.from(document.querySelectorAll('#studentRows tr')).map(function(tr) { 
    return { 
      n: tr.querySelector('.student-name').value.trim(), 
      ph: tr.querySelector('.student-phone').value.trim(),
      ex: parseFloat(tr.querySelector('.student-extra').value) || 0
    }; 
  }).filter(function(x) { return x.n !== ''; }); 
}

function saveStudentRows(gid, rows) { rows.forEach(function(x, i) { db.s.push({ id: String(Date.now()) + i + Math.random().toString(36).slice(2, 6), n: x.n, g: gid, ph: x.ph, ex: x.ex }); }); }

function openStudentEntry(title, gid, isNewGroup) {
  var f = document.getElementById('df'), d = document.getElementById('dlg');
  var html = '';
  if (isNewGroup) {
    html += '<input id="newGroupName" placeholder="اسم المجموعة">' +
            '<input id="newGroupFee" type="number" inputmode="decimal" placeholder="مصاريف الطالب في الشهر">' +
            '<label style="font-size:13px;color:var(--mut);display:block;margin-bottom:6px">أيام الحضور أسبوعياً:</label>' +
            '<div class="days-grid">' +
            '<label class="day-chk"><input type="checkbox" class="gday" value="0" checked> أحد</label>' +
            '<label class="day-chk"><input type="checkbox" class="gday" value="1" checked> إثنين</label>' +
            '<label class="day-chk"><input type="checkbox" class="gday" value="2" checked> ثلاثاء</label>' +
            '<label class="day-chk"><input type="checkbox" class="gday" value="3" checked> أربعاء</label>' +
            '<label class="day-chk"><input type="checkbox" class="gday" value="4" checked> خميس</label>' +
            '<label class="day-chk"><input type="checkbox" class="gday" value="5" checked> جمعة</label>' +
            '<label class="day-chk"><input type="checkbox" class="gday" value="6" checked> سبت</label>' +
            '</div>';
  }
  html += '<div class="hint">اكتب كل طالب في صف مستقل. خانة الإضافي (للملازم/المذكرات) اختيارية.</div>' + studentRowsHTML(3) + '<div class="dlg-actions"><button id="studentSave">حفظ الطلاب</button><button class="sec" id="studentCancel">إلغاء</button></div>';
  f.innerHTML = html; document.getElementById('dt').textContent = title; d.showModal(); setupStudentRows();
  document.getElementById('studentCancel').onclick = function() { d.close(); };
  document.getElementById('studentSave').onclick = function() {
    var rows = collectStudentRows();
    if (isNewGroup) {
      var name = document.getElementById('newGroupName').value.trim();
      if (!name) { alert('اكتب اسم المجموعة الأول'); return; }
      var selectedDays = Array.from(document.querySelectorAll('.gday:checked')).map(function(el){ return parseInt(el.value); });
      var id = 'g' + Date.now();
      db.g.push({ id: id, n: name, fee: parseFloat(document.getElementById('newGroupFee').value) || 0, days: selectedDays.length ? selectedDays : [0,1,2,3,4,5,6] });
      saveStudentRows(id, rows); gsel = id;
    } else {
      if (!rows.length) { alert('اكتب اسم طالب واحد على الأقل'); return; }
      saveStudentRows(gid, rows); gsel = gid;
    }
    save(); d.close(); render();
  };
}

function newGroup() { openStudentEntry('مجموعة جديدة', null, true); }
function newStudents(gid) { openStudentEntry('إضافة طلاب إلى ' + grp(gid).n, gid, false); }

function editGroup(id) {
  var g = grp(id);
  var dayNames = ["أحد", "إثنين", "ثلاثاء", "أربعاء", "خميس", "جمعة", "سبت"];
  var daysHtml = '<label style="font-size:13px;color:var(--mut);display:block;margin-bottom:6px">أيام الحضور أسبوعياً:</label><div class="days-grid">';
  for(var i=0; i<7; i++){
    var isChecked = !g.days || g.days.includes(i) ? ' checked' : '';
    daysHtml += '<label class="day-chk"><input type="checkbox" class="edday" value="'+i+'"'+isChecked+'> '+dayNames[i]+'</label>';
  }
  daysHtml += '</div>';

  ask("تعديل المجموعة", [{ p: "اسم المجموعة", v: g.n }, { p: "مصاريف الطالب في الشهر", num: 1, v: g.fee }], function(v) {
    if (!v[0]) return false;
    g.n = v[0]; g.fee = parseFloat(v[1]) || 0;
    var editedDays = Array.from(document.querySelectorAll('.edday:checked')).map(function(el){ return parseInt(el.value); });
    g.days = editedDays.length ? editedDays : [0,1,2,3,4,5,6];
    save(); render(); return true;
  }, null, daysHtml);
}

function editStudent(id) {
  var s = db.s.find(function(x) { return x.id === id; }), g = grp(s.g);
  ask("تعديل الطالب", [
    { p: "اسم الطالب", v: s.n }, 
    { p: "مصاريف خاصة (اكتبها لو مختلفة عن المجموعة)", num: 1, v: s.cf }, 
    { p: "مصاريف إضافية (ملازم/مذكرات)", num: 1, v: s.ex }, 
    { p: "موبايل ولي الأمر (اختياري)", tel: 1, v: s.ph }, 
    { chk: "معفي من المصاريف", v: s.free }
  ], function(v) { 
    if (!v[0]) return false; 
    s.n = v[0]; 
    s.cf = v[1] === "" ? null : parseFloat(v[1]); 
    s.ex = parseFloat(v[2]) || 0;
    s.ph = v[3]; 
    s.free = !!v[4]; 
    save(); render(); return true; 
  }, { label: "حذف الطالب", fn: function() { if (confirm("حذف " + s.n + "؟")) { db.s = db.s.filter(function(x) { return x.id !== id; }); save(); render(); return true; } return false; } });
}

function ask(title, fields, ok, extra, customHtml) {
  var f = document.getElementById("df"), d = document.getElementById("dlg");
  f.innerHTML = (customHtml || '') + fields.map(function(x, i) {
    var v = x.v == null ? "" : x.v;
    if (x.chk) return '<label class="chk"><input type="checkbox" id="f' + i + '"' + (v ? ' checked' : '') + '> ' + x.chk + '</label>';
    return '<input id="f' + i + '" placeholder="' + esc(x.p) + '" value="' + esc(v) + '"' + (x.num ? ' type="number" inputmode="decimal"' : '') + (x.tel ? ' type="tel"' : '') + '>';
  }).join("") + '<div class="row" style="margin-top:10px"><button id="ok">حفظ</button><button class="sec" id="no">إلغاء</button></div>' + (extra ? '<button class="red" id="ex" style="width:100%;margin-top:10px">' + extra.label + '</button>' : '');
  document.getElementById("dt").textContent = title; d.showModal();
  document.getElementById("no").onclick = function() { d.close(); };
  if (extra) document.getElementById("ex").onclick = function() { if (extra.fn()) d.close(); };
  document.getElementById("ok").onclick = function() { var v = fields.map(function(x, i) { var e = document.getElementById("f" + i); return x.chk ? e.checked : e.value.trim(); }); if (ok(v)) d.close(); };
}

render();
</script>
</body>
</html>
